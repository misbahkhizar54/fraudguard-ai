<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}FraudGuard AI{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <aside class="sidebar">

        <div class="brand">
            <h2>FraudGuard AI</h2>
            <p>Fraud Intelligence</p>
        </div>

        <nav class="sidebar-nav">

            <a
                href="{{ url_for('home') }}"
                class="{% if request.endpoint == 'home' %}active{% endif %}"
            >
                Dashboard
            </a>

            <a
                href="{{ url_for('analyze') }}"
                class="{% if request.endpoint == 'analyze' %}active{% endif %}"
            >
                Analyze Transaction
            <a
                href="{{ url_for('cases') }}"
                class="{% if request.endpoint == 'cases' %}active{% endif %}"
            >
                Cases
            </a>

            <a
                href="{{ url_for('ai_assistant') }}"
                class="{% if request.endpoint == 'ai_assistant' %}active{% endif %}"
            >
                AI Assistant
            </a>

        </nav>

        <div class="model-status">
            <span class="status-dot"></span>
            ML Engine Online
        </div>

    </aside>

    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>

</body>
</html>
